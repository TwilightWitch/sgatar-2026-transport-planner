sonar.projectKey=sgatar-2026-transport-planner
sonar.projectName=SGATAR 2026 Transport Planner
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=node_modules/**,coverage/**,.next/**,public/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Strict 80% coverage gate
sonar.coverage.exclusions=src/db/seed.ts,src/lib/i18n/**
sonar.cpd.minimumTokens=50
