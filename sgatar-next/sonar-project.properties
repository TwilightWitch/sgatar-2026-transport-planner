sonar.projectKey=sgatar-2026-transport-planner
sonar.projectName=SGATAR 2026 Transport Planner
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.exclusions=node_modules/**,coverage/**,.next/**,public/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Strict 80% coverage gate
sonar.coverage.exclusions=src/db/seed.ts,src/lib/i18n/**
sonar.cpd.minimumTokens=50

# S6747 (unknown JSX property) and S6766 (unescaped HTML entity) produce
# false positives in .tsx files because SonarLint's JSX parser misreads
# attribute fragments when CRLF line endings are present.  Both rules fire
# only on syntactically valid JSX that TypeScript and ESLint accept without
# error, so they are suppressed project-wide for TSX sources.
sonar.issue.ignore.multicriteria=jsx-s6747,jsx-s6766
sonar.issue.ignore.multicriteria.jsx-s6747.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.jsx-s6747.resourceKey=**/*.tsx
sonar.issue.ignore.multicriteria.jsx-s6766.ruleKey=typescript:S6766
sonar.issue.ignore.multicriteria.jsx-s6766.resourceKey=**/*.tsx
