server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options          "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options   "nosniff"                      always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    # Inline <script> and <style> blocks require 'unsafe-inline'
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none';" always;

    # Serve the SPA; fall back to index.html for any unknown path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (none here, but future-proof)
    location ~* \.(css|js|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_types      text/css application/javascript application/json;
    gzip_min_length 1024;

    # Health-check endpoint (no logging)
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
